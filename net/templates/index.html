{% load static %} 
<!DOCTYPE html> 
<html lang="fr"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0">     
    <title>Netmonitor | Plateforme de Monitoring </title>     
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head> 

<!-- Restitution stricte de ton style de body original --> 
<body class="bg-orange-50 w-full min-h-screen bg-[radial-gradient(#000000_1px,transparent_1px)] [background-size:16px_16px] flex flex-col justify-between font-sans">      
    
    <!-- HEADER / NAVIGATION -->     
    <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-5 flex flex-col sm:flex-row justify-between items-center gap-4">         
        <a href="/" class="flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded-lg">             
            <!-- Logo agrandi et propre -->    
             <img src="{% static 'images/reseau.png' %}" alt="logo de reseau informatique">         
            <p class="font-bold">Net<span class="bg-green-500 rounded-bl-4xl shadow text-white p-2">Monitor</span> </p>         
        </a>         
        
        <nav class="flex items-center gap-4 sm:gap-8 text-sm sm:text-base font-semibold text-slate-900">             
            <a href="{% url 'login' %}" class="flex items-center gap-2 hover:text-emerald-600 transition-colors duration-200">                 
                <!-- Icône Connexion (SVG) -->
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-emerald-600 shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                </svg>
                Se connecter             
            </a>             
            
            <a href="{% url 'register' %}" class="flex items-center gap-2 bg-green-500 text-white px-4 sm:px-5 py-2.5 sm:py-3 rounded-xl font-bold shadow-md hover:bg-emerald-500 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-600">                 
                <!-- Icône Inscription / Activité (SVG) -->
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12h3.375a1.125 1.125 0 0 1 1.056.775l1.226 3.811a1.125 1.125 0 0 0 2.143-.042l2.678-8.567a1.125 1.125 0 0 1 2.143-.042l1.353 4.31a1.125 1.125 0 0 0 1.056.775H21.75" />
                </svg>
                S'inscrire             
            </a>         
        </nav>     
    </header>      
    
    <!-- SECTION HÉROS (HERO SECTION) -->     
    <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-12 md:py-20 flex flex-col items-center text-center my-auto">         
        <!-- Badge Statut Réseau -->                  
        
        <!-- Titre Principal -->         
        <h1 class="text-3xl sm:text-4xl md:text-6xl font-extrabold tracking-tight text-slate-900 max-w-4xl leading-tight md:leading-none inline-flex items-center justify-center flex-wrap gap-2">             
            Supervisez votre infrastructure <span class="text-green-500">reseau</span>             
            <!-- Icône Réseau (SVG) -->
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8 sm:w-10 sm:h-10 text-red-500 inline-block align-middle ml-1 sm:ml-2 shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21M6.75 6.75h10.5a2.25 2.25 0 0 1 2.25 2.25v10.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V9a2.25 2.25 0 0 1 2.25-2.25Z" />
            </svg>
        </h1>                  
        
        <!-- Sous-titre -->         
        <p class="mt-5 sm:mt-6 text-base sm:text-lg md:text-xl text-slate-700 max-w-2xl font-medium leading-relaxed bg-white/60 backdrop-blur-sm p-3 rounded-xl border border-slate-100">             
            Gardez un œil sur vos serveurs, réseaux et applications. Anticipez les pannes et optimisez vos performances grâce à nos alertes instantanées.         
        </p>                  
        
        <!-- Boutons d'Action (CTA) -->         
        <div class="mt-8 sm:mt-10 flex flex-col sm:flex-row gap-4 w-full sm:w-auto justify-center">             
            <a href="#" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-slate-900 text-white px-6 sm:px-8 py-3.5 sm:py-4 rounded-xl font-bold shadow-lg hover:bg-slate-800 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900">                 
                Lancer le monitoring                 
                <!-- Icône Flèche Droite (SVG) -->
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 text-green-500 shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
            </a>                      
        </div>                       
    </main>       
</body> 
</html>
